name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_python:
    name: Lint Python files with flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          # stop the build for syntax errors and undefined names
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,frontend,node_modules
          # full style check
          flake8 server --count --max-line-length=79 --statistics --exclude=migrations,frontend,node_modules

  lint_js:
    name: Lint JavaScript files with JSHint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run JSHint on the Node backend
        run: |
          cd server/database
          jshint --config ../../.jshintrc app.js dealership.js review.js inventory.js
